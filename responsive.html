<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova AI — Responsive Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05060f;
      font-family: 'Segoe UI', sans-serif;
      padding: 40px 24px;
      color: #f4f5fa;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    p.subtitle {
      text-align: center;
      color: #9ca3c4;
      font-size: 0.9rem;
      margin-bottom: 40px;
    }
    .frames {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
    }
    .device {
      text-align: center;
    }
    .device-label {
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #22d3ee;
      margin-bottom: 10px;
    }
    .device-frame {
      border: 3px solid #2a2f4a;
      border-radius: 14px;
      background: #0b0e1f;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .device-frame iframe {
      display: block;
      border: none;
      background: #05060f;
    }

    /* Laptop: 1280px design scaled down to fit the slide */
    .laptop .device-frame {
      width: 620px;
      height: 388px;
    }
    .laptop iframe {
      width: 1280px;
      height: 800px;
      transform: scale(0.484);
      transform-origin: top left;
    }

    /* Tablet: 768px design scaled down */
    .tablet .device-frame {
      width: 300px;
      height: 400px;
      border-radius: 22px;
    }
    .tablet iframe {
      width: 768px;
      height: 1024px;
      transform: scale(0.39);
      transform-origin: top left;
    }

    /* Mobile: 390px design scaled down */
    .mobile .device-frame {
      width: 190px;
      height: 400px;
      border-radius: 26px;
    }
    .mobile iframe {
      width: 390px;
      height: 820px;
      transform: scale(0.4872);
      transform-origin: top left;
    }

    @media (max-width: 900px) {
      .frames { gap: 20px; }
    }
  </style>
</head>
<body>

  <h1>Nova AI — Home Page Across Devices</h1>
  <p class="subtitle">Same HTML/CSS, three viewports — Mobile · Tablet · Laptop</p>

  <div class="frames">
    <div class="device mobile">
      <p class="device-label">Mobile · 390px</p>
      <div class="device-frame">
        <iframe src="index.html" title="Mobile preview" scrolling="no"></iframe>
      </div>
    </div>

    <div class="device tablet">
      <p class="device-label">Tablet · 768px</p>
      <div class="device-frame">
        <iframe src="index.html" title="Tablet preview" scrolling="no"></iframe>
      </div>
    </div>

    <div class="device laptop">
      <p class="device-label">Laptop · 1280px</p>
      <div class="device-frame">
        <iframe src="index.html" title="Laptop preview" scrolling="no"></iframe>
      </div>
    </div>
  </div>

</body>
</html>
